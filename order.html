<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อสินค้า Body Scent">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container--narrow">
      <div class="section-head">
        <h1 class="page-title">สั่งซื้อสินค้า</h1>
        <hr class="rule">
        <p class="lead">กรอกข้อมูลของคุณ แล้วกดยืนยัน เราจะติดต่อกลับเพื่อแจ้งรายละเอียดการชำระเงินและการจัดส่ง</p>
      </div>

      <form id="orderForm" class="order-form">
        <label class="field">
          <span class="field__label">ชื่อลูกค้า <span class="req">*</span></span>
          <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
        </label>

        <label class="field">
          <span class="field__label">เบอร์โทร / Line <span class="req">*</span></span>
          <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
        </label>

        <label class="field">
          <span class="field__label">รายการสินค้า <span class="req">*</span></span>
          <textarea class="textarea" id="items" name="items" rows="3" required></textarea>
        </label>

        <label class="field">
          <span class="field__label">จำนวนเงินรวม (บาท) <span class="req">*</span></span>
          <input class="input" type="number" id="total" name="total" min="0" inputmode="numeric" required>
        </label>

        <label class="field">
          <span class="field__label">หมายเหตุ</span>
          <textarea class="textarea" id="note" name="note" rows="3"></textarea>
        </label>

        <button class="btn btn--solid btn--block" type="submit">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span class="brand">Body Scent</span>
      <span>© 2026 Body Scent</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
